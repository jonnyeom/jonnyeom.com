# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "CI"

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: true

jobs:
  build:
    name: "Build deps"
    runs-on: "ubuntu-24.04"
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: none
          php-version: 8.4
          extensions: curl
          tools: composer, cs2pr
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache php dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install php dependencies
        run: "composer install --no-progress --prefer-dist --classmap-authoritative --ansi"
      - name: Cache vendor for jobs
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-vendor
      - name: Install node dependencies
        run: pnpm install
      - name: Lint frontend (oxlint)
        run: pnpm lint
      - name: Test frontend (Vitest)
        run: pnpm test
      - name: Build bundle
        run: pnpm build
      - name: Cache build for jobs
        uses: actions/cache@v5
        with:
          path: public/build
          key: ${{ github.sha }}-build

  docker-build:
    name: "Docker build"
    runs-on: "ubuntu-24.04"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  phpcs:
    name: "PHP CS"
    runs-on: "ubuntu-24.04"
    needs: build
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: none
          php-version: 8.4
          extensions: curl
          tools: composer, cs2pr
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-vendor
      - name: Run PHP_CodeSniffer
        run: "vendor/bin/phpcs -nq --report=checkstyle | cs2pr"

  phpstan:
    name: "PHPStan"
    runs-on: "ubuntu-24.04"
    needs: build
    strategy:
      fail-fast: false
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: 8.4
          tools: composer
          extensions: curl
          coverage: none
          ini-values: memory_limit=-1
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-vendor
      - name: Setup Kernel Cache
        run: bin/console cache:warm --env=test
      - name: Run PHPStan analysis
        run: |
          ./vendor/bin/phpstan --version
          ./vendor/bin/phpstan analyse -c phpstan.dist.neon --no-interaction --no-progress --ansi

  phpunit:
    name: "PHPUnit"
    runs-on: "ubuntu-24.04"
    needs: build
    strategy:
      fail-fast: false
    services:
      database:
        image: postgres:15.5-alpine
        env:
          # The test env appends "_test" to the database name (see config/packages/doctrine.yaml).
          POSTGRES_DB: app_test
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://app:app_password@127.0.0.1:5432/app?serverVersion=15.5&charset=utf8"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: 8.4
          extensions: curl, pdo_pgsql
          ini-values: memory_limit=-1
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-vendor
      - name: Run database migrations
        run: bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
      - name: Retrieve cached build folder
        uses: actions/cache@v5
        with:
          path: public/build
          key: ${{ github.sha }}-build
      - name: Setup problem matchers for PHPUnit
        run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Install PHPUnit
        run: vendor/bin/simple-phpunit --version
      - name: Run PHPUnit tests
        run: vendor/bin/simple-phpunit

  e2e:
    name: "E2E"
    runs-on: "ubuntu-24.04"
    needs: build
    services:
      database:
        image: postgres:15.5-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://app:app_password@127.0.0.1:5432/app?serverVersion=15.5&charset=utf8"
    steps:
      - name: Checkout
        uses: "actions/checkout@v6"
      - name: Setup PHP
        uses: "shivammathur/setup-php@v2"
        with:
          coverage: none
          php-version: 8.4
          extensions: curl, pdo_pgsql
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
      - name: Retrieve cached vendor folder
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ github.sha }}-vendor
      - name: Retrieve cached build folder
        uses: actions/cache@v5
        with:
          path: public/build
          key: ${{ github.sha }}-build
      - name: Install node dependencies
        run: pnpm install
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm e2e

  deploy:
    name: "Deploy to Render"
    runs-on: "ubuntu-24.04"
    needs: [build, phpcs, phpstan, phpunit, e2e, docker-build]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: Render Production
    steps:
      - name: Trigger Render deploy
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
